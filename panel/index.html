<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Engram</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #root { height: 100%; display: flex; flex-direction: column; }
      .toolbar { padding: 8px 10px; border-bottom: 1px solid var(--ok-3, rgba(128,128,128,0.25)); }
      .toolbar-main { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
      /* Pin the first line (title + control captions) to one line-height so the title
         column's second line lands on the same row as the inputs/select triggers. */
      .toolbar-main .oc-sdk-field-label { line-height: 20px; }
      .title-col { display: flex; flex-direction: column; gap: 4px; }
      .title { display: flex; align-items: baseline; gap: 6px; margin-right: 4px; white-space: nowrap; }
      .title-name { font-weight: 600; line-height: 20px; }
      .title-version { font-size: 12px; color: var(--ok-2, #888); line-height: 20px; }
      .title-status { display: flex; align-items: center; min-height: 32px; }
      .content { flex: 1; overflow: auto; padding: 10px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .detail pre { white-space: pre-wrap; word-break: break-word; }
      .note { font-size: 12px; color: var(--ok-2, #888); padding: 6px 0; }
      .actions { display: flex; gap: 6px; padding-bottom: 8px; }
      h3 { margin: 4px 0 8px; }
      .hidden { display: none; }
      .content :is(p, ul, ol, pre, blockquote, table) { margin: 6px 0; }
      .content code { font-family: ui-monospace, monospace; font-size: 0.875em; background: var(--ok-3, rgba(128,128,128,0.18)); border-radius: 4px; padding: 0 4px; }
      .content pre { overflow-x: auto; }
      .content pre code { background: none; padding: 0; }
      .content table { border-collapse: collapse; width: 100%; }
      .content :is(th, td) { border: 1px solid var(--ok-3, rgba(128,128,128,0.3)); padding: 4px 8px; text-align: left; }
      .content blockquote { border-left: 3px solid var(--ok-3, rgba(128,128,128,0.4)); margin-left: 0; padding-left: 10px; color: var(--ok-2, #888); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
