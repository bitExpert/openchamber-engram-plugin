<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Engram</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #root { height: 100%; display: flex; flex-direction: column; }
      .toolbar { padding: 8px 10px; border-bottom: 1px solid var(--ok-3, rgba(128,128,128,0.25)); }
      .toolbar-main { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
      .toolbar-main .oc-sdk-field-label { line-height: 20px; }
      .title-col { display: flex; flex-direction: column; gap: 4px; }
      .title { display: flex; align-items: baseline; gap: 6px; margin-right: 4px; white-space: nowrap; }
      .title-name { font-weight: 600; line-height: 20px; }
      .title-version { font-size: 12px; color: var(--ok-2, #888); line-height: 20px; }
      .title-status { display: flex; align-items: center; min-height: 32px; }
      .content { flex: 1; overflow: auto; padding: 10px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .detail pre { white-space: pre-wrap; word-break: break-word; }
      .note { font-size: 12px; color: var(--ok-2, #888); padding: 6px 0; }
      .project-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; padding: 2px 0 8px; }
      .project-label { font-weight: 600; }
      .project-source { color: var(--ok-2, #888); }
      .project-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
      .actions { display: flex; gap: 6px; padding-bottom: 8px; }
      h3 { margin: 4px 0 8px; }
      .hidden { display: none; }
      .content :is(p, ul, ol, pre, blockquote, table) { margin: 6px 0; }
      .content code { font-family: ui-monospace, monospace; font-size: 0.875em; background: var(--ok-3, rgba(128,128,128,0.18)); border-radius: 4px; padding: 0 4px; }
      .content pre { overflow-x: auto; }
      .content pre code { background: none; padding: 0; }
      .content table { border-collapse: collapse; width: 100%; }
      .content :is(th, td) { border: 1px solid var(--ok-3, rgba(128,128,128,0.3)); padding: 4px 8px; text-align: left; }
      .content blockquote { border-left: 3px solid var(--ok-3, rgba(128,128,128,0.4)); margin-left: 0; padding-left: 10px; color: var(--ok-2, #888); }
      .stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 2px 0 8px; }
      .stat-tile { display: flex; min-width: 0; flex-direction: column; gap: 2px; border-radius: var(--radius, 9px); border: 1px solid color-mix(in srgb, var(--interactive-border, currentColor) 70%, transparent); background: var(--surface-elevated, transparent); padding: 10px 12px; }
      .stat-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.75rem; line-height: 1.45; color: var(--surface-muted-foreground, gray); }
      .stat-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1.25rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--surface-foreground, inherit); }
      .tabs-section { margin-top: 8px; }
      .tab-content { margin-top: 10px; }
      .detail-card { display: flex; flex-direction: column; gap: 12px; border-radius: var(--radius, 9px); border: 1px solid color-mix(in srgb, var(--interactive-border, currentColor) 70%, transparent); background: var(--surface-elevated, transparent); padding: 12px 14px; }
      .detail-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .detail-title { flex: 1; min-width: 0; margin: 0; font-size: 1rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
      .detail-meta { display: grid; grid-template-columns: minmax(84px, max-content) minmax(0, 1fr); gap: 6px 14px; font-size: 0.8125rem; }
      .detail-meta-key { color: var(--surface-muted-foreground, gray); }
      .detail-meta-value { color: var(--surface-foreground, inherit); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
      .detail-meta-value a { color: var(--primary, #5b8def); text-decoration: none; }
      .detail-meta-value a:hover { text-decoration: underline; }
      .detail-divider { border: 0; border-top: 1px solid color-mix(in srgb, var(--interactive-border, currentColor) 60%, transparent); }
      .session-counts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .count-tile { display: flex; flex-direction: column; gap: 2px; border-radius: var(--radius, 9px); border: 1px solid color-mix(in srgb, var(--interactive-border, currentColor) 70%, transparent); padding: 8px 12px; }
      .count-value { font-size: 1.1rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--surface-foreground, inherit); }
      .count-label { font-size: 0.75rem; line-height: 1.45; color: var(--surface-muted-foreground, gray); }
      .section { margin-top: 20px; }
      .section-heading { margin: 0 0 8px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--surface-muted-foreground, gray); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
